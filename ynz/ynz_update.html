<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>樱奈子更新日志 - 版本时间线</title>
    <script src="../js/vendor/tailwind.js"></script>
    <link href="../css/vendor/font-awesome.min.css" rel="stylesheet">
    <script src="../js/vendor/highlight.min.js"></script>
    <link rel="stylesheet" href="../css/vendor/atom-one-light.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4A90E2',
                        secondary: '#87CEFA',
                        darkBlue: '#1E64C8',
                        lightBlue: '#E6F4FF',
                        navy: '#0F3460'
                    },
                    fontFamily: {
                        anime: ['"Microsoft YaHei"', 'PingFang SC', 'Hiragino Sans GB', 'sans-serif']
                    },
                    boxShadow: {
                        'anime': '0 0 15px rgba(74, 144, 226, 0.6), 0 0 25px rgba(135, 206, 250, 0.4)',
                        'anime-sm': '0 0 8px rgba(74, 144, 226, 0.5), 0 0 12px rgba(135, 206, 250, 0.3)'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .anime-border {
                border: 2px solid transparent;
                background-clip: padding-box, border-box;
                background-origin: padding-box, border-box;
                background-image: linear-gradient(to bottom, #f8fafc, #f1f5f9), linear-gradient(135deg, #4A90E2, #87CEFA, #4A90E2);
            }
            .anime-border-card {
                border: 1px solid transparent;
                background-clip: padding-box, border-box;
                background-origin: padding-box, border-box;
                background-image: linear-gradient(to bottom, white, white), linear-gradient(90deg, #4A90E2, #87CEFA);
            }
            .scrollbar-anime {
                scrollbar-width: thin;
                scrollbar-color: #4A90E2 #E6F4FF;
            }
            .scrollbar-anime::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            .scrollbar-anime::-webkit-scrollbar-thumb {
                background-color: #4A90E2;
                border-radius: 4px;
            }
            .scrollbar-anime::-webkit-scrollbar-track {
                background-color: #E6F4FF;
                border-radius: 4px;
            }
            .anchor-offset {
                scroll-margin-top: 80px;
            }
            .eicon {
                display: inline-block;
                width: 1.25em;
                height: 1.25em;
                vertical-align: -0.25em;
            }
            .timeline-line {
                position: absolute;
                left: 24px;
                top: 0;
                bottom: 0;
                width: 3px;
                background: linear-gradient(to bottom, #4A90E2, #87CEFA, #4A90E2);
                border-radius: 3px;
                pointer-events: none;
                z-index: 1;
            }
            .timeline-dot {
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: white;
                border: 3px solid #4A90E2;
                position: absolute;
                left: 17px;
                top: 24px;
                z-index: 10;
                transition: all 0.3s ease;
            }
            .timeline-item.active .timeline-dot {
                background: #4A90E2;
                box-shadow: 0 0 10px rgba(74, 144, 226, 0.8);
                transform: scale(1.2);
            }
            .timeline-item {
                position: relative;
                padding-left: 56px;
                cursor: pointer;
                transition: all 0.3s ease;
                z-index: 5;
            }
            .timeline-item:hover .timeline-content {
                background: rgba(74, 144, 226, 0.1);
            }
            .timeline-item.active .timeline-content {
                background: rgba(74, 144, 226, 0.15);
                border-left: 3px solid #4A90E2;
            }
            .timeline-content {
                padding: 16px;
                border-radius: 12px;
                border-left: 3px solid transparent;
                transition: all 0.3s ease;
                position: relative;
                z-index: 6;
                background: white;
            }
            .version-badge {
                display: inline-block;
                padding: 4px 12px;
                border-radius: 20px;
                font-size: 0.75rem;
                font-weight: bold;
                margin-bottom: 4px;
            }
            .version-badge.v3 {
                background: linear-gradient(135deg, #4A90E2, #87CEFA);
                color: white;
            }
            .version-badge.v2 {
                background: linear-gradient(135deg, #87CEFA, #4A90E2);
                color: white;
            }
            .version-badge.v4 {
                background: linear-gradient(135deg, #F59E0B, #EF4444);
                color: white;
            }
            .content-section {
                display: none;
            }
            .content-section.active {
                display: block;
                animation: fadeIn 0.4s ease;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            /* 折叠状态优化 */
            .sidebar-collapsed {
                width: 70px;
            }
            .sidebar-collapsed .timeline-text,
            .sidebar-collapsed .version-badge {
                opacity: 0;
                transform: translateX(-10px);
                pointer-events: none;
            }
            .sidebar-collapsed .timeline-line {
                left: 33px;
            }
            .sidebar-collapsed .timeline-dot {
                left: 26px;
                width: 20px;
                height: 20px;
                border-width: 4px;
            }
            .sidebar-collapsed .timeline-item {
                padding-left: 15px;
                padding-right: 15px;
            }
            .sidebar-collapsed .timeline-content {
                padding: 12px 8px;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 60px;
            }
            .sidebar-collapsed .timeline-item:hover .timeline-dot {
                transform: scale(1.3);
                box-shadow: 0 0 15px rgba(74, 144, 226, 0.6);
            }
            .sidebar-collapsed .timeline-item.active .timeline-dot {
                background: linear-gradient(135deg, #4A90E2, #87CEFA);
                border-color: #1E64C8;
                box-shadow: 0 0 15px rgba(74, 144, 226, 0.9);
            }

            /* Tooltip for collapsed state */
            .timeline-tooltip {
                position: absolute;
                left: 55px;
                top: 50%;
                transform: translateY(-50%) scale(0.8);
                background: linear-gradient(135deg, #4A90E2, #87CEFA);
                color: white;
                padding: 6px 12px;
                border-radius: 8px;
                font-size: 12px;
                white-space: nowrap;
                opacity: 0;
                pointer-events: none;
                transition: all 0.2s ease;
                z-index: 100;
                box-shadow: 0 4px 12px rgba(74, 144, 226, 0.4);
            }
            .timeline-tooltip::before {
                content: '';
                position: absolute;
                left: -6px;
                top: 50%;
                transform: translateY(-50%);
                border: 6px solid transparent;
                border-right-color: #4A90E2;
            }
            .sidebar-collapsed .timeline-item:hover .timeline-tooltip {
                opacity: 1;
                transform: translateY(-50%) scale(1);
            }

            /* 移动端样式 */
            @media (max-width: 768px) {
                #sidebar {
                    width: 280px;
                    transform: translateX(-100%);
                    box-shadow: 4px 0 20px rgba(0,0,0,0.15);
                }
                #sidebar.mobile-open {
                    transform: translateX(0);
                }
                #mainContent {
                    margin-left: 0 !important;
                    width: 100%;
                }
                .timeline-line {
                    left: 20px;
                }
                .timeline-dot {
                    left: 13px;
                    width: 14px;
                    height: 14px;
                    border-width: 2.5px;
                }
                .timeline-item {
                    padding-left: 45px;
                }
                /* 移动端遮罩层 */
                .sidebar-overlay {
                    display: none;
                    position: fixed;
                    top: 64px;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: rgba(0,0,0,0.5);
                    z-index: 35;
                    backdrop-filter: blur(2px);
                }
                .sidebar-overlay.active {
                    display: block;
                }
            }

            /* 小屏手机优化 */
            @media (max-width: 480px) {
                #sidebar {
                    width: 260px;
                }
                .timeline-content {
                    padding: 12px;
                }
                .version-badge {
                    font-size: 0.7rem;
                    padding: 3px 10px;
                }
            }

            /* 鼠标跟随光效 */
            .cursor-glow {
                position: fixed;
                width: 400px;
                height: 400px;
                background: radial-gradient(circle, rgba(74, 144, 226, 0.12) 0%, transparent 70%);
                border-radius: 50%;
                pointer-events: none;
                z-index: 0;
                transform: translate(-50%, -50%);
                transition: opacity 0.3s;
            }

            /* 樱花花瓣飘落特效 */
            .sakura-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 2;
                overflow: hidden;
            }

            .sakura-petal {
                position: absolute;
                width: 15px;
                height: 15px;
                background: linear-gradient(135deg, #FFB6C1 0%, #FFC0CB 50%, #FFD1DC 100%);
                border-radius: 100% 0 100% 0;
                opacity: 0.7;
                box-shadow: 0 0 5px rgba(255, 182, 193, 0.3);
            }

            .sakura-petal::before {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 60%;
                height: 60%;
                background: linear-gradient(135deg, rgba(255,255,255,0.5), transparent);
                border-radius: 100% 0 100% 0;
            }

            /* 飘落动画 - 较慢速度 */
            @keyframes sakura-fall-1 {
                0% {
                    transform: translateY(-10vh) translateX(0) rotate(0deg);
                    opacity: 0;
                }
                10% {
                    opacity: 0.7;
                }
                90% {
                    opacity: 0.7;
                }
                100% {
                    transform: translateY(110vh) translateX(30px) rotate(360deg);
                    opacity: 0;
                }
            }

            @keyframes sakura-fall-2 {
                0% {
                    transform: translateY(-10vh) translateX(0) rotate(0deg);
                    opacity: 0;
                }
                10% {
                    opacity: 0.7;
                }
                90% {
                    opacity: 0.7;
                }
                100% {
                    transform: translateY(110vh) translateX(-40px) rotate(-360deg);
                    opacity: 0;
                }
            }

            @keyframes sakura-fall-3 {
                0% {
                    transform: translateY(-10vh) translateX(0) rotate(0deg);
                    opacity: 0;
                }
                10% {
                    opacity: 0.7;
                }
                90% {
                    opacity: 0.7;
                }
                100% {
                    transform: translateY(110vh) translateX(50px) rotate(540deg);
                    opacity: 0;
                }
            }

            @keyframes sakura-fall-4 {
                0% {
                    transform: translateY(-10vh) translateX(0) rotate(0deg);
                    opacity: 0;
                }
                10% {
                    opacity: 0.7;
                }
                90% {
                    opacity: 0.7;
                }
                100% {
                    transform: translateY(110vh) translateX(-25px) rotate(-540deg);
                    opacity: 0;
                }
            }

            /* 移动端隐藏鼠标效果 */
            @media (max-width: 768px) {
                .cursor-glow {
                    display: none;
                }
            }

            /* 自定义鼠标指针 - 使用图片，左上角为点击区域 */
            * {
                cursor: url('../img/pos.png') 0 0, auto !important;
            }

            /* 点击时的浅蓝色光圈扩散特效 */
            .click-ripple {
                position: fixed;
                width: 20px;
                height: 20px;
                border: 2px solid rgba(135, 206, 250, 0.8);
                border-radius: 50%;
                pointer-events: none;
                z-index: 99999;
                transform: translate(-50%, -50%);
                animation: ripple-expand 0.6s ease-out forwards;
                box-shadow: 0 0 10px rgba(135, 206, 250, 0.6), inset 0 0 10px rgba(135, 206, 250, 0.4);
            }

            @keyframes ripple-expand {
                0% {
                    width: 10px;
                    height: 10px;
                    opacity: 1;
                    border-width: 3px;
                }
                100% {
                    width: 80px;
                    height: 80px;
                    opacity: 0;
                    border-width: 0px;
                }
            }

            /* 点击时的中心点高亮 */
            .click-ripple::before {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 6px;
                height: 6px;
                background: rgba(74, 144, 226, 0.9);
                border-radius: 50%;
                box-shadow: 0 0 8px rgba(74, 144, 226, 0.8);
                animation: ripple-center 0.4s ease-out forwards;
            }

            @keyframes ripple-center {
                0% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1);
                }
                100% {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(0.5);
                }
            }

            /* 移动端恢复默认指针 */
            @media (max-width: 768px) {
                * {
                    cursor: auto !important;
                }
                a, button, [role="button"] {
                    cursor: pointer !important;
                }
            }
        }
    </style>
</head>
<body class="bg-slate-50 font-anime text-slate-800 scrollbar-anime">
    <!-- 鼠标跟随光效 -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <!-- 樱花花瓣 -->
    <div class="sakura-container" id="sakuraContainer"></div>

    <!-- 顶部导航 -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-sm shadow-anime-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-[clamp(1.2rem,3vw,1.8rem)] font-bold text-primary flex items-center">
                <i class="fa fa-heart text-darkBlue mr-2"></i>樱奈子更新日志
            </h1>
            <div class="flex items-center gap-2">
                <a href="./index.html" class="text-primary text-xl p-2 rounded-lg hover:bg-lightBlue/30 transition-colors" title="返回能力指南" aria-label="返回能力指南">
                    <i class="fa fa-book"></i>
                </a>
                <a href="../index.html" class="text-primary text-xl p-2 rounded-lg hover:bg-lightBlue/30 transition-colors" title="返回网站首页" aria-label="返回网站首页"><i class="fa fa-home"></i></a>
                <button id="sidebarToggle" class="text-primary text-xl p-2 rounded-lg hover:bg-lightBlue/30 transition-colors" title="切换侧边栏" onclick="toggleSidebar()">
                    <i class="fa fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 移动端遮罩层 -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- 主容器 -->
    <div class="flex pt-16 min-h-screen">
        <!-- 左侧时间线侧边栏 -->
        <aside id="sidebar" class="fixed left-0 top-16 bottom-0 w-72 bg-white shadow-anime-sm overflow-y-auto scrollbar-anime z-40" style="transition: transform 0.3s ease, opacity 0.3s ease;">
            <div class="p-4">
                <h2 class="text-lg font-bold text-darkBlue mb-6 flex items-center px-2">
                    <i class="fa fa-history mr-2"></i>版本时间线
                </h2>
                <div class="relative" id="timelineContainer" style="min-height: calc(100vh - 250px);">
                    <!-- 时间线由 JS 动态渲染 -->
                </div>
            </div>
        </aside>

        <!-- 右侧内容区域 -->
        <main id="mainContent" class="flex-1" style="transition: margin-left 0.3s ease; margin-left: 288px;">
        </main>
    </div>

    <!-- 特效脚本 -->
    <script>
        // 检测是否为触摸设备
        function isTouchDevice() {
            return window.matchMedia('(pointer: coarse)').matches ||
                   'ontouchstart' in window ||
                   navigator.maxTouchPoints > 0;
        }

        // 鼠标跟随光效
        function initCursorGlow() {
            const cursorGlow = document.getElementById('cursorGlow');
            if (!cursorGlow) return;

            let mouseX = 0, mouseY = 0;
            let glowX = 0, glowY = 0;

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function animateGlow() {
                glowX += (mouseX - glowX) * 0.08;
                glowY += (mouseY - glowY) * 0.08;
                cursorGlow.style.left = glowX + 'px';
                cursorGlow.style.top = glowY + 'px';
                requestAnimationFrame(animateGlow);
            }
            animateGlow();
        }

        // 创建樱花花瓣
        function createSakura() {
            const container = document.getElementById('sakuraContainer');
            if (!container) return;

            const petalCount = 12;
            const animations = ['sakura-fall-1', 'sakura-fall-2', 'sakura-fall-3', 'sakura-fall-4'];

            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.className = 'sakura-petal';
                petal.style.left = Math.random() * 100 + '%';
                const animType = animations[Math.floor(Math.random() * animations.length)];
                petal.style.animationName = animType;
                const duration = 12 + Math.random() * 8;
                petal.style.animationDuration = duration + 's';
                petal.style.animationDelay = Math.random() * 15 + 's';
                const scale = 0.7 + Math.random() * 0.5;
                petal.style.transform = `scale(${scale})`;
                petal.style.animationIterationCount = 'infinite';
                petal.style.animationTimingFunction = 'linear';
                container.appendChild(petal);
            }
        }

        // 鼠标拖尾效果
        function initCursorTrail() {
            const canvas = document.createElement('canvas');
            canvas.id = 'cursorTrail';
            canvas.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 9998;
            `;
            document.body.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            let width, height;
            let trail = [];
            const trailDuration = 1000;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            let lastX = 0, lastY = 0;
            document.addEventListener('mousemove', (e) => {
                const now = Date.now();
                const dist = Math.hypot(e.clientX - lastX, e.clientY - lastY);
                if (dist > 5) {
                    trail.push({ x: e.clientX, y: e.clientY, time: now });
                    lastX = e.clientX;
                    lastY = e.clientY;
                }
            });

            function animate() {
                const now = Date.now();
                ctx.clearRect(0, 0, width, height);
                trail = trail.filter(point => now - point.time < trailDuration);

                if (trail.length > 1) {
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    const startPoint = trail[0];
                    const endPoint = trail[trail.length - 1];
                    const gradient = ctx.createLinearGradient(startPoint.x, startPoint.y, endPoint.x, endPoint.y);
                    gradient.addColorStop(0, 'rgba(168, 216, 255, 0.8)');
                    gradient.addColorStop(1, 'rgba(255, 209, 220, 0.8)');

                    for (let i = 1; i < trail.length; i++) {
                        const p1 = trail[i - 1];
                        const p2 = trail[i];
                        const age = now - p1.time;
                        const progress = 1 - (age / trailDuration);
                        ctx.strokeStyle = gradient;
                        ctx.lineWidth = 4 * progress + 2;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        // 初始化点击光圈特效
        function initClickRipple() {
            // 移动端不启用
            if (isTouchDevice()) return;

            document.addEventListener('click', (e) => {
                const ripple = document.createElement('div');
                ripple.className = 'click-ripple';
                ripple.style.left = e.clientX + 'px';
                ripple.style.top = e.clientY + 'px';
                document.body.appendChild(ripple);

                // 动画结束后移除元素
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        }

        // 初始化特效
        document.addEventListener('DOMContentLoaded', () => {
            createSakura();
            if (!isTouchDevice()) {
                initCursorGlow();
                initCursorTrail();
                initClickRipple();
            }
        });
    </script>

    <!-- JavaScript -->
    <script src="../js/ynzup.js"></script>
</body>
</html>
